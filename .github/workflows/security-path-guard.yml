name: Security Path Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-tracked-sensitive-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect sensitive tracked paths
        run: npm run security:check-tracked
